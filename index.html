<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jamon's JS Playground</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        overflow-x: hidden;
      }
      body {
        font-family: "San Francisco", "Lato", "Inter", sans-serif;
        margin: 0;
        padding: 0;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        /* Liquid glass gradient background */
        background: linear-gradient(135deg, #b6e0fe 0%, #e0c3fc 100%);
        position: relative;
        /* Add a subtle animated gradient for extra depth */
        background-size: 400% 400%;
        animation: glass-bg-move 20s ease-in-out infinite;
      }

      @keyframes glass-bg-move {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      header,
      footer {
        display: flex;
        justify-content: center;
        text-align: center;
      }

      h1 {
        font-family: "Lato", sans-serif;
        font-weight: 400;
        font-size: 2.5rem;
      }

      .container {
        text-align: left;
        display: flex;
        flex-direction: row;
        width: 98vw;
        max-width: none;
        margin: 20px auto;
        gap: 20px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 32px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1.5px solid rgba(255, 255, 255, 0.35);
      }

      .left-column {
        flex: 3;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 28px;
        box-shadow: 0 4px 24px 0 rgba(31, 38, 135, 0.1);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 32px 22px;
        min-width: 0;
      }
      .right-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 28px;
        box-shadow: 0 4px 24px 0 rgba(31, 38, 135, 0.1);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 32px 22px;
        min-width: 260px;
        width: 100%;
      }

      #session-name,
      #code-box,
      #output {
        background: rgba(255, 255, 255, 0.32);
        border-radius: 22px;
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        box-shadow: 0 2px 8px 0 rgba(31, 38, 135, 0.1);
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        color: #222;
      }

      .title-row {
        display: flex;
        gap: 12px;
        align-items: stretch;
        min-width: 0;
      }
      @media (max-width: 600px) {
        .title-row #pretty .btn-text {
          display: none;
        }
        .title-row #pretty {
          padding: 12px 14px;
        }
      }
      #session-name {
        flex: 1;
        font-size: 20px;
        padding: 16px;
      }
      .title-row #pretty {
        padding: 12px 18px;
        font-size: 15px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
        color: #222;
        box-shadow: 0 2px 8px 0 rgba(31, 38, 135, 0.1);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        cursor: pointer;
        transition: background 0.2s, box-shadow 0.2s, color 0.2s;
        font-weight: 600;
        white-space: nowrap;
      }
      .title-row #pretty:hover {
        background: linear-gradient(135deg, #a6c1ee 0%, #fbc2eb 100%);
        color: #007aff;
        box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.18);
      }

      #code-box {
        min-height: 30em;
        font-size: 16px;
        font-family: monospace;
        line-height: 1.5em;
        white-space: pre;
        padding: 18px;
        resize: vertical;
      }

      #output {
        min-height: 10em;
        font-family: monospace;
        font-size: 15px;
        padding: 18px;
        color: #222;
      }

      .action-buttons {
        display: flex;
        gap: 14px;
        flex-wrap: nowrap;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
      }
      .action-buttons button {
        flex: 1 1 0;
        min-width: 0;
        padding: 10px 0;
        font-size: 15px;
        border: none;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.22);
        color: #222;
        box-shadow: 0 2px 8px 0 rgba(31, 38, 135, 0.1);
        backdrop-filter: blur(10px) saturate(140%);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        cursor: pointer;
        transition: background 0.2s, box-shadow 0.2s, color 0.2s;
        font-weight: 600;
      }
      .action-buttons button:hover {
        background: rgba(255, 255, 255, 0.38);
        color: #007aff;
        box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.18);
      }
      #run-button {
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        color: #222;
      }
      #run-button:hover {
        background: linear-gradient(135deg, #fed6e3 0%, #a8edea 100%);
        color: #007aff;
      }
      #copy-url {
        background: linear-gradient(135deg, #b6e0fe 0%, #e0c3fc 100%);
        color: #222;
      }
      #new {
        background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%);
        color: #222;
      }
      #screenshot {
        background: linear-gradient(135deg, #c3cfe2 0%, #f5f7fa 100%);
        color: #222;
      }

      .running {
        animation: pulse 1s infinite;
        box-shadow: 0 0 15px 4px rgba(76, 175, 80, 0.25);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 15px 4px rgba(76, 175, 80, 0.1);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 25px 8px rgba(76, 175, 80, 0.18);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 15px 4px rgba(76, 175, 80, 0.1);
        }
      }

      #sessions-list {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .session-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 18px;
        padding: 12px 18px;
        box-shadow: 0 2px 8px 0 rgba(31, 38, 135, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        cursor: pointer;
        transition: background 0.2s, box-shadow 0.2s;
      }
      .session-item:hover {
        background: rgba(255, 255, 255, 0.38);
        box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.18);
      }
      .session-item .delete-button {
        background: transparent;
        border: none;
        cursor: pointer;
        color: #ff6347;
        font-size: 18px;
        margin-left: 8px;
      }
      .session-item .content-preview {
        font-size: 14px;
        color: #666;
        display: block;
      }
      .error {
        outline: 2px solid #ffcccc !important;
        color: #ff3333 !important;
        background: rgba(255, 0, 0, 0.08) !important;
      }
      .active {
        background: rgba(0, 122, 255, 0.18) !important;
        border: 1.5px solid #007aff !important;
      }
      .error-line {
        background: rgba(255, 0, 0, 0.1) !important;
        border-left: 3px solid #ff3333 !important;
        transition: background 0.2s ease-in-out;
      }
      body.dark .error-line {
        background: rgba(255, 0, 0, 0.15) !important;
        border-left: 3px solid #ff6666 !important;
      }
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }
        .right-column {
          margin-top: 20px;
        }
      }
      /* Liquid Glass: Dark mode */
      body.dark {
        background: linear-gradient(135deg, #232526 0%, #414345 100%);
        color: #e0e0e0;
        background-size: 400% 400%;
        animation: glass-bg-move 20s ease-in-out infinite;
      }
      body.dark .container {
        background: rgba(30, 30, 40, 0.32);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.28);
      }
      body.dark .left-column,
      body.dark .right-column {
        background: rgba(30, 30, 40, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.18);
      }
      body.dark #session-name,
      body.dark #code-box,
      body.dark #output {
        background: rgba(30, 30, 40, 0.32);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        color: #e0e0e0;
        box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.18);
      }
      body.dark .title-row #pretty {
        background: linear-gradient(135deg, #232526 0%, #414345 100%);
        color: #e0e0e0;
      }
      body.dark .title-row #pretty:hover {
        background: linear-gradient(135deg, #414345 0%, #232526 100%);
        color: #7abaff;
      }
      body.dark #output {
        color: #e0e0e0;
      }
      body.dark .action-buttons button {
        background: rgba(30, 30, 40, 0.22);
        color: #e0e0e0;
        box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.18);
      }
      body.dark .action-buttons button:hover {
        background: rgba(30, 30, 40, 0.38);
        color: #7abaff;
        box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.28);
      }
      body.dark #run-button {
        background: linear-gradient(135deg, #232526 0%, #414345 100%);
        color: #e0e0e0;
      }
      body.dark #run-button:hover {
        background: linear-gradient(135deg, #414345 0%, #232526 100%);
        color: #7abaff;
      }
      body.dark #copy-url {
        background: linear-gradient(135deg, #434343 0%, #262626 100%);
        color: #e0e0e0;
      }
      body.dark #new {
        background: linear-gradient(135deg, #232526 0%, #414345 100%);
        color: #e0e0e0;
      }
      body.dark #screenshot {
        background: linear-gradient(135deg, #232526 0%, #414345 100%);
        color: #e0e0e0;
      }
      body.dark .session-item {
        background: rgba(30, 30, 40, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e0e0e0;
        box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.18);
      }
      body.dark .session-item:hover {
        background: rgba(30, 30, 40, 0.38);
        box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.28);
      }
      body.dark .session-item .content-preview {
        color: #b0b0b0;
      }
      body.dark .session-item .delete-button {
        color: #ff6666;
      }
      body.dark .error {
        outline: 2px solid #ff6666 !important;
        color: #ff6666 !important;
        background: rgba(255, 0, 0, 0.1) !important;
      }
      body.dark .active {
        background: rgba(0, 122, 255, 0.18) !important;
        border: 1.5px solid #7abaff !important;
      }
      body.dark a,
      body.dark a:visited {
        color: #e0e0e0;
      }
      @media (min-width: 768px) and (max-width: 1168px) {
        .action-buttons .btn-text {
          display: none;
        }
      }

      /* Screenshot Overlay */
      .screenshot-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s, visibility 0.2s;
      }
      .screenshot-overlay.visible {
        opacity: 1;
        visibility: visible;
      }
      .screenshot-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #1a1a2e;
        border-bottom: 1px solid #333;
      }
      .screenshot-branding {
        color: #666;
        font-size: 12px;
        text-align: right;
        padding: 8px 12px 0;
      }
      .screenshot-toolbar input[type="range"] {
        width: 70px;
        accent-color: #7abaff;
      }
      #font-size-value {
        color: #aaa;
        font-size: 12px;
        min-width: 30px;
      }
      .screenshot-toolbar select {
        background: #2a2a3e;
        border: 1px solid #555;
        color: #ddd;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      .screenshot-toolbar select:hover {
        border-color: #777;
      }
      #wrap-toggle,
      #diff-toggle {
        font-size: 16px;
        padding: 4px 10px;
      }
      .screenshot-code-container .diff-add {
        display: inline-block;
        width: 100%;
        background: rgba(46, 160, 67, 0.25);
      }
      .screenshot-code-container .diff-del {
        display: inline-block;
        width: 100%;
        background: rgba(248, 81, 73, 0.25);
      }

      /* Prettier Config Overlay */
      .config-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s, visibility 0.2s;
      }
      .config-overlay.visible {
        opacity: 1;
        visibility: visible;
      }
      .config-modal {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 20px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .config-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        color: #ddd;
        font-weight: 600;
      }
      .config-close {
        background: transparent;
        border: none;
        color: #888;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      .config-close:hover {
        color: #fff;
      }
      #prettier-config {
        width: 100%;
        height: 200px;
        background: #0d1117;
        border: 1px solid #333;
        border-radius: 8px;
        color: #e0e0e0;
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 13px;
        padding: 12px;
        resize: vertical;
      }
      .config-error {
        color: #ff6b6b;
        font-size: 13px;
        margin-top: 8px;
        min-height: 20px;
      }
      .config-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        justify-content: flex-end;
      }
      .config-actions button {
        padding: 8px 18px;
        border-radius: 6px;
        border: 1px solid #555;
        background: #2a2a3e;
        color: #ddd;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s, border-color 0.15s;
      }
      .config-actions button:hover {
        background: #3a3a4e;
        border-color: #777;
      }
      .config-actions button:last-child {
        background: #7abaff;
        color: #111;
        border-color: #7abaff;
      }
      .config-actions button:last-child:hover {
        background: #5aa0e8;
        border-color: #5aa0e8;
      }
      .screenshot-toolbar input[type="range"] {
        width: 100px;
        accent-color: #7abaff;
      }
      .screenshot-toolbar button {
        background: transparent;
        border: 1px solid #555;
        color: #ddd;
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.15s, border-color 0.15s;
      }
      .screenshot-toolbar button:hover {
        background: #333;
        border-color: #777;
      }
      .screenshot-toolbar button.active {
        background: #7abaff;
        color: #111;
        border-color: #7abaff;
      }
      .screenshot-toolbar-spacer {
        flex: 1;
      }
      .screenshot-close {
        background: transparent;
        border: none;
        color: #888;
        font-size: 28px;
        cursor: pointer;
        padding: 0 8px;
        line-height: 1;
        transition: color 0.15s;
      }
      .screenshot-close:hover {
        color: #fff;
      }
      .screenshot-code-container {
        flex: 1;
        overflow: auto;
        padding: 20px;
      }
      .screenshot-code-container pre {
        margin: 0;
        background: #0d1117 !important;
        border-radius: 12px;
        padding: 20px;
        min-height: 100%;
      }
      .screenshot-code-container code {
        font-family: "SF Mono", "Fira Code", "Monaco", "Consolas", monospace;
        line-height: 1.5;
      }
      .screenshot-code-container.wrap-text pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
      @media (max-width: 600px) {
        .screenshot-toolbar {
          padding: 8px 10px;
          gap: 6px;
        }
        .screenshot-toolbar input[type="range"] {
          width: 50px;
        }
        #font-size-value {
          min-width: 24px;
          font-size: 11px;
        }
        .screenshot-toolbar select {
          padding: 4px 6px;
          font-size: 12px;
        }
        #wrap-toggle,
        #diff-toggle {
          font-size: 14px;
          padding: 2px 6px;
        }
        .screenshot-close {
          font-size: 22px;
        }
        .screenshot-code-container {
          padding: 12px;
        }
        .screenshot-code-container pre {
          padding: 14px;
          border-radius: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Jamon's JS Playground</h1>
    </header>

    <div class="container">
      <div class="left-column">
        <div class="title-row">
          <input id="session-name" placeholder="Title" autocapitalize="off" autocorrect="off" />
          <button id="pretty">💙 <span class="btn-text">Format</span></button>
        </div>
        <textarea
          id="code-box"
          placeholder="Write your JavaScript code here..."
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        ></textarea>
      </div>
      <div class="right-column">
        <div class="action-buttons">
          <button id="run-button">▶️ <span class="btn-text">Run</span></button>
          <button id="copy-url">⬆️ <span class="btn-text">Share</span></button>
          <button id="screenshot">📷 <span class="btn-text">Shot</span></button>
          <button id="new">➕ <span class="btn-text">New</span></button>
        </div>
        <div id="output"></div>
        <div id="sessions-list"></div>
      </div>
    </div>

    <div class="screenshot-overlay" id="screenshot-overlay">
      <div class="screenshot-toolbar">
        <input type="range" id="font-size-slider" min="8" max="24" value="14" />
        <span id="font-size-value">14px</span>
        <select id="theme-picker">
          <option value="github-dark">GitHub Dark</option>
          <option value="monokai">Monokai</option>
          <option value="base16/dracula">Dracula</option>
          <option value="nord">Nord</option>
          <option value="atom-one-dark">Atom One Dark</option>
          <option value="vs2015">VS 2015</option>
          <option value="tokyo-night-dark">Tokyo Night</option>
          <option value="androidstudio">Android Studio</option>
        </select>
        <button id="diff-toggle" title="Diff mode">±</button>
        <button id="wrap-toggle" title="Word wrap">↩️</button>
        <span class="screenshot-toolbar-spacer"></span>
        <button class="screenshot-close" id="screenshot-close">&times;</button>
      </div>
      <div class="screenshot-code-container" id="screenshot-code-container">
        <pre><code id="screenshot-code" class="language-javascript"></code></pre>
        <div class="screenshot-branding">js.jamon.dev</div>
      </div>
    </div>

    <footer>
      <p>
        <a href="" onclick="toggleDarkMode(); return false;">mode: light</a>
        • <a href="" onclick="openPrettierConfig(); return false;">prettier config</a> •
        <a href="https://jamon.dev" target="_blank">jamon.dev</a> •
        <a href="https://infinite.red" target="_blank">infinite.red</a> •
        <a href="https://twitter.com/jamonholmgren" target="_blank">@jamonholmgren</a> •
        <a href="https://github.com/jamonholmgren/js" target="_blank">source</a>
      </p>
    </footer>

    <div class="config-overlay" id="prettier-overlay">
      <div class="config-modal">
        <div class="config-header">
          <span>Prettier Config</span>
          <button class="config-close" onclick="closePrettierConfig()">&times;</button>
        </div>
        <textarea id="prettier-config" spellcheck="false"></textarea>
        <div id="config-error" class="config-error"></div>
        <div class="config-actions">
          <button onclick="resetPrettierConfig()">Reset</button>
          <button onclick="savePrettierConfig()">Save</button>
        </div>
      </div>
    </div>

    <script>
      let currentSession = ""
      let currentSessionId = "" // Track the session ID
      let sessions = {}

      const sessionsKey = "jsSessions" // Don't change this unless you want to lose all saved sessions
      const codeBox = document.getElementById("code-box")
      const sessionNameInput = document.getElementById("session-name")
      const sessionsList = document.getElementById("sessions-list")
      const runButton = document.getElementById("run-button")
      const copyUrlButton = document.getElementById("copy-url")
      const newButton = document.getElementById("new")
      const prettyButton = document.getElementById("pretty")
      const outputDiv = document.getElementById("output")
      const darkModeButton = document.querySelector("footer a")

      document.addEventListener("DOMContentLoaded", function () {
        applyDarkMode()

        // Initialize console overrides for the main window
        //overrideConsole(window)

        // check for shared or ID session in URL
        const urlParams = new URLSearchParams(window.location.search)
        const urlCode = urlParams.get("code")
        if (urlParams.has("id")) {
          const id = urlParams.get("id")
          loadSession(id)
        } else if (urlCode) {
          const decodedCode = decodeURIComponent(urlCode)
          codeBox.value = decodedCode
          sessionNameInput.value = ""
          currentSession = ""
          currentSessionId = "" // Reset the session ID since it's loaded from URL
        }

        updateSessionsList()
      })

      // Save the code and session name to localStorage on input
      codeBox.addEventListener("input", saveCurrentSession)
      sessionNameInput.addEventListener("input", saveCurrentSession)

      function parseImports(code) {
        const importRegex = /\/\/\s*@import\s+([^/\s]+(?:\/[^/\s]+)*\.js)/g
        const imports = []
        let match
        while ((match = importRegex.exec(code)) !== null) {
          imports.push(match[1])
        }
        return imports
      }

      function sanitizeImportPath(path) {
        // Remove any leading '/' or '..' to prevent directory traversal
        return path.replace(/^[./]+/, "").replace(/\.\./g, "")
      }

      // Add this function to create and return a new iframe
      function createSandbox() {
        return new Promise((resolve) => {
          const iframe = document.createElement("iframe")
          iframe.style.display = "none"
          iframe.onload = () => {
            setupSandbox(iframe)
            resolve(iframe)
          }
          document.body.appendChild(iframe)
        })
      }

      // Modify the loadImports function to load imports into the iframe
      async function loadImports(imports, iframe) {
        const win = iframe.contentWindow
        const doc = iframe.contentDocument

        for (const path of imports) {
          const sanitizedPath = sanitizeImportPath(path)
          const url = `https://unpkg.com/${sanitizedPath}`
          await new Promise((resolve, reject) => {
            const script = doc.createElement("script")
            script.src = url
            script.onload = resolve
            script.onerror = reject
            doc.head.appendChild(script)
          })
        }
      }

      // Modify the runButton event listener
      runButton.addEventListener("click", async function () {
        runButton.classList.add("running")

        const code = codeBox.value
        outputDiv.classList.remove("error")
        outputDiv.textContent = ""

        const imports = parseImports(code)

        try {
          // Create a new sandbox for this run
          const sandbox = await createSandbox()

          await loadImports(imports, sandbox)

          const wrappedCode = `;(async () => {
            try{
              // MAGIC_LINE_MARKER - DO NOT REMOVE THIS COMMENT
              ${code}
            } catch(e) {
              // Calculate line offset based on the magic marker position
              const wrappedLines = \`\${e.stack}\`.split('\\n');
              const magicLineMatch = wrappedLines.findIndex(line => 
                line.includes('MAGIC_LINE_MARKER')
              );
              
              // If we found the magic line, use it to calculate the offset
              // Otherwise fall back to the raw line number
              const lineOffset = magicLineMatch >= 0 ? magicLineMatch + 1 : 0;
              
              // Send error details to parent window with adjusted line number
              parent.showError({
                message: e.toString(),
                stack: e.stack,
                line: e.lineNumber ? Math.max(1, e.lineNumber - lineOffset) : (
                  e.stack && e.stack.split('\\n')[1]?.match(/:(\\d+):/)?.[1]
                    ? Math.max(1, parseInt(e.stack.split('\\n')[1].match(/:(\\d+):/)?.[1]) - lineOffset)
                    : null
                ),
                column: e.columnNumber || (e.stack && e.stack.split('\\n')[1]?.match(/:(\\d+):(\\d+)/)?.[2])
              });
            }
          })();`

          // Run the code in the sandbox
          sandbox.contentWindow.eval(wrappedCode)
        } catch (error) {
          showError(error)
        } finally {
          // Remove the sandbox after execution
          setTimeout(() => {
            const sandbox = document.querySelector("iframe")
            if (sandbox) document.body.removeChild(sandbox)
            runButton.classList.remove("running")
          }, 1000)
        }
      })

      // Modify the showError function to work with the iframe
      function showError(error) {
        console.error("[Sandbox Error]", error)
        outputDiv.classList.add("error")

        // Remove any existing error line highlighting
        const existingErrorLine = codeBox.parentElement.querySelector(".error-line")
        if (existingErrorLine) {
          existingErrorLine.classList.remove("error-line")
        }

        // Handle both Error objects and our custom error format from iframe
        const lineNum = error.line ? parseInt(error.line) - 1 : null
        const colNum = error.column ? parseInt(error.column) : null

        // Format the error message
        let errorMessage = error.message || error.toString()

        // Remove the "Error:" prefix if it exists
        errorMessage = errorMessage.replace(/^Error: /, "")

        // Add line number if available
        if (lineNum !== null) {
          errorMessage = `Line ${lineNum + 1}: ${errorMessage}`
        }

        // Add stack trace if available, but only the first line
        if (error.stack) {
          const firstStackLine = error.stack.split("\n")[1]
          if (firstStackLine) {
            // Clean up the stack trace line
            const cleanedStack = firstStackLine
              .replace(/at eval \(eval at <anonymous> \([^)]+\)/, "")
              .replace(/at <anonymous>/, "")
              .replace(/at eval/, "")
              .replace(/\([^)]+\)/, "") // Remove any remaining parenthetical content
              .replace(/,\s*<anonymous>:\d+:\d+\)/, "") // Remove the line/column info from the end
              .trim()
            if (cleanedStack) {
              errorMessage += "\n\n" + cleanedStack
            }
          }
        }

        outputDiv.textContent = errorMessage
      }

      // Modify console overrides to work with the iframe
      function overrideConsole(win) {
        ;["log", "error", "warn", "info"].forEach(function (method) {
          win.console[method] = function (...args) {
            console[method]("[Sandbox]", ...args)
            outputDiv.textContent += args.join(" ") + "\n"
          }
        })

        win.console.assert = (condition, message) => {
          if (!condition) {
            win.console.error(message)
            throw new Error(message)
          }
        }
      }

      // Call this function when creating the sandbox
      function setupSandbox(iframe) {
        overrideConsole(iframe.contentWindow)
        iframe.contentWindow.showError = showError
      }

      function getSessions() {
        return JSON.parse(localStorage.getItem(sessionsKey)) || {}
      }

      function saveSessions(sessions) {
        localStorage.setItem(sessionsKey, JSON.stringify(sessions))
      }

      function saveCurrentSession() {
        let sessionName = sessionNameInput.value.trim()
        const sessions = getSessions()

        // Generate a new session ID if it doesn't exist
        if (!currentSessionId) {
          currentSessionId = new Date().getTime().toString()
        }

        // Use the current session name if no name is provided
        if (!sessionName) {
          sessionName = currentSession || new Date().toLocaleString()
        }

        // If the session ID already exists, update the session name and code
        sessions[currentSessionId] = {
          id: currentSessionId,
          name: sessionName,
          code: codeBox.value,
        }

        // Save the updated sessions back to localStorage
        saveSessions(sessions)

        // Update the current session info
        currentSession = sessionName

        updateSessionsList()
        updateURL()
      }

      function loadSession(id) {
        const sessions = getSessions()
        if (sessions && sessions[id]) {
          codeBox.value = sessions[id].code
          sessionNameInput.value = sessions[id].name
          currentSession = sessions[id].name
          currentSessionId = sessions[id].id
          outputDiv.textContent = "// run to see output"
        }

        // Clear any existing output
        outputDiv.textContent = "// run to see output"

        // If there's an existing sandbox, remove it
        const existingSandbox = document.querySelector("iframe")
        if (existingSandbox) {
          document.body.removeChild(existingSandbox)
        }

        updateSessionsList()
        updateURL()
      }

      function updateURL() {
        const suffix = currentSessionId ? `?id=${currentSessionId}` : ""
        window.history.replaceState({}, document.title, `${window.location.pathname}${suffix}`)
      }

      function updateSessionsList() {
        const sessions = getSessions()
        sessionsList.innerHTML = ""
        Object.values(sessions)
          .reverse()
          .forEach((session) => sessionsList.appendChild(createSessionItem(session)))
      }

      function createSessionItem(session) {
        const sessionItem = document.createElement("div")
        sessionItem.className = "session-item"
        sessionItem.dataset.id = session.id

        if (session.id === currentSessionId) {
          sessionItem.classList.add("active")
        }

        const sessionName = document.createElement("span")
        sessionName.textContent = session.name.slice(0, 22)
        sessionItem.onclick = () => loadSession(session.id)

        const contentPreview = document.createElement("span")
        contentPreview.classList.add("content-preview")
        contentPreview.textContent = session.code
          .slice(0, 40)
          .split("\n")
          .find((line) => line.trim() !== "")
        sessionName.appendChild(contentPreview)

        const deleteButton = document.createElement("button")
        deleteButton.className = "delete-button"
        deleteButton.innerHTML = "🗑"
        deleteButton.onclick = (event) => {
          event.stopPropagation()
          if (confirm(`Are you sure you want to delete the session "${session.name}"?`)) {
            deleteSession(session.id)
          }
        }

        sessionItem.appendChild(sessionName)
        sessionItem.appendChild(deleteButton)
        return sessionItem
      }

      function deleteSession(id) {
        const sessions = getSessions()
        delete sessions[id]
        saveSessions(sessions)
        updateSessionsList()

        // If the deleted session is currently loaded, clear the inputs
        if (!sessions[id]) {
          currentSession = ""
          currentSessionId = ""
          codeBox.value = ""
          sessionNameInput.value = ""
        }
      }

      function newSession() {
        currentSession = ""
        currentSessionId = ""
        codeBox.value = ""
        sessionNameInput.value = ""

        updateSessionsList()
      }

      // Copy the current code as a URL
      copyUrlButton.addEventListener("click", copyUrl)
      newButton.addEventListener("click", newSession)
      codeBox.addEventListener("keydown", function (e) {
        const codeBox = this
        const tabCharacter = "  " // Two spaces for indentation

        if (e.key === "Tab" && !e.altKey && !e.ctrlKey && !e.metaKey) {
          e.preventDefault()
          const value = codeBox.value
          let start = codeBox.selectionStart
          let end = codeBox.selectionEnd

          // Normalize line endings to \n
          const normalizedValue = value.replace(/\r\n/g, "\n")
          const beforeSelection = normalizedValue.slice(0, start)
          const selectedText = normalizedValue.slice(start, end)
          const afterSelection = normalizedValue.slice(end)

          // Find the start and end of the affected lines
          const lastNewLine = beforeSelection.lastIndexOf("\n")
          const startLine = lastNewLine === -1 ? 0 : lastNewLine + 1
          const endLine = normalizedValue.indexOf("\n", end)
          const endLineAdjusted = endLine === -1 ? normalizedValue.length : endLine

          // Split the affected text into lines
          const affectedText = normalizedValue.slice(startLine, endLineAdjusted)
          const lines = affectedText.split("\n")

          let modifiedLines
          if (e.shiftKey) {
            // Deindent
            modifiedLines = lines.map((line) =>
              line.startsWith(tabCharacter) ? line.slice(tabCharacter.length) : line
            )
          } else {
            // Indent
            modifiedLines = lines.map((line) => tabCharacter + line)
          }

          // Join the lines back together
          const modifiedText = modifiedLines.join("\n")

          // Calculate new selection start and end
          const startDiff = modifiedLines[0].length - lines[0].length
          const totalDiff = modifiedText.length - affectedText.length

          const newText =
            normalizedValue.slice(0, startLine) +
            modifiedText +
            normalizedValue.slice(endLineAdjusted)
          const newStart = start + startDiff
          const newEnd = end + totalDiff

          // Replace the text and set the new selection
          replaceCode(newText, newStart, newEnd)

          // Trigger input event to notify any listeners of the change
          codeBox.dispatchEvent(new Event("input", { bubbles: true }))
        }
      })

      // Prettify the code on clicking the pretty button
      prettyButton.addEventListener("click", prettifyCode)

      async function prettifyCode() {
        const btn = prettyButton
        const originalText = btn.innerHTML

        if (typeof prettier === "undefined") {
          const p1 = loadScript("https://unpkg.com/prettier@3.3.3/standalone.js")
          const p2 = loadScript("https://unpkg.com/prettier@3.3.3/plugins/estree.js")
          const p3 = loadScript("https://unpkg.com/prettier@3.3.3/plugins/typescript.js")
          await Promise.allSettled([p1, p2, p3])
        }

        const code = codeBox.value
        try {
          const config = { ...getPrettierConfig(), plugins: prettierPlugins }
          const formattedCode = await prettier.format(code, config)
          replaceCode(formattedCode)
          btn.innerHTML = '✅ <span class="btn-text">Format</span>'
        } catch (error) {
          showError("Failed to prettify code: \n\n" + error)
          btn.innerHTML = '❌ <span class="btn-text">Format</span>'
        }
        setTimeout(() => (btn.innerHTML = originalText), 2000)
      }

      async function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script")
          script.src = src
          script.onload = resolve
          script.onerror = reject
          document.head.appendChild(script)
        })
      }

      function copyUrl() {
        let encodedCode = encodeURIComponent(codeBox.value)
        // also convert parentheses to avoid URL encoding issues
        encodedCode = encodedCode.replace(/\(/g, "%28").replace(/\)/g, "%29")
        const url = `${window.location.origin}${window.location.pathname}?code=${encodedCode}`
        navigator.clipboard
          .writeText(url)
          .then(() => {
            // temporarily change the button text to indicate success
            const prevText = copyUrlButton.textContent
            copyUrlButton.textContent = "✅ Share"
            setTimeout(() => (copyUrlButton.textContent = prevText), 2000)
          })
          .catch((err) => {
            showError("Failed to copy URL:\n\n" + err)
          })
      }

      function replaceCode(text, selectionStart, selectionEnd) {
        codeBox.focus()
        document.execCommand("selectAll", false, null)
        document.execCommand("insertText", false, text)

        // Set the selection range after a short delay
        setTimeout(() => {
          codeBox.setSelectionRange(selectionStart, selectionEnd)
        }, 0)
      }

      // hijack cmd+s / ctrl+s to copy URL
      document.addEventListener("keydown", function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key === "s") {
          e.preventDefault()
          copyUrl()
        }
      })

      function mode() {
        return localStorage.getItem("mode") || "light"
      }

      function otherMode() {
        return mode() === "dark" ? "light" : "dark"
      }

      function toggleDarkMode() {
        localStorage.setItem("mode", otherMode())
        applyDarkMode()
      }

      function applyDarkMode() {
        if (mode() === "dark") {
          document.body.classList.add("dark")
        } else {
          document.body.classList.remove("dark")
        }
        darkModeButton.textContent = "mode: " + mode()
      }

      // Prettier config
      const prettierConfigKey = "prettierConfig"
      const prettierOverlay = document.getElementById("prettier-overlay")
      const prettierConfigTextarea = document.getElementById("prettier-config")
      const configError = document.getElementById("config-error")

      const defaultPrettierConfig = {
        parser: "typescript",
        printWidth: 100,
        tabWidth: 2,
        useTabs: false,
        semi: false,
        singleQuote: false,
        trailingComma: "es5",
        bracketSpacing: true,
        arrowParens: "always",
      }

      function getPrettierConfig() {
        try {
          const saved = localStorage.getItem(prettierConfigKey)
          return saved ? JSON.parse(saved) : { ...defaultPrettierConfig }
        } catch {
          return { ...defaultPrettierConfig }
        }
      }

      function openPrettierConfig() {
        const config = getPrettierConfig()
        prettierConfigTextarea.value = JSON.stringify(config, null, 2)
        configError.textContent = ""
        prettierOverlay.classList.add("visible")
      }

      function closePrettierConfig() {
        prettierOverlay.classList.remove("visible")
      }

      function savePrettierConfig() {
        try {
          const config = JSON.parse(prettierConfigTextarea.value)
          config.parser = "typescript"
          config.plugins = undefined
          localStorage.setItem(prettierConfigKey, JSON.stringify(config))
          configError.textContent = ""
          closePrettierConfig()
        } catch (e) {
          configError.textContent = "Invalid JSON: " + e.message
        }
      }

      function resetPrettierConfig() {
        prettierConfigTextarea.value = JSON.stringify(defaultPrettierConfig, null, 2)
        configError.textContent = ""
      }

      prettierOverlay.addEventListener("click", (e) => {
        if (e.target === prettierOverlay) closePrettierConfig()
      })
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && prettierOverlay.classList.contains("visible")) {
          closePrettierConfig()
        }
      })

      // Screenshot overlay
      const screenshotButton = document.getElementById("screenshot")
      const screenshotOverlay = document.getElementById("screenshot-overlay")
      const screenshotCode = document.getElementById("screenshot-code")
      const screenshotContainer = document.getElementById("screenshot-code-container")
      const screenshotClose = document.getElementById("screenshot-close")
      const fontSizeSlider = document.getElementById("font-size-slider")
      const fontSizeValue = document.getElementById("font-size-value")
      const wrapToggle = document.getElementById("wrap-toggle")

      const screenshotSettingsKey = "screenshotSettings"
      const themePicker = document.getElementById("theme-picker")
      const diffToggle = document.getElementById("diff-toggle")
      let hljsLoaded = false
      let currentThemeLink = null

      function getScreenshotSettings() {
        const defaults = { fontSize: 14, wordWrap: true, theme: "github-dark", diffMode: true }
        try {
          return { ...defaults, ...JSON.parse(localStorage.getItem(screenshotSettingsKey)) }
        } catch {
          return defaults
        }
      }

      function saveScreenshotSettings(settings) {
        localStorage.setItem(screenshotSettingsKey, JSON.stringify(settings))
      }

      function applyScreenshotSettings() {
        const settings = getScreenshotSettings()
        fontSizeSlider.value = settings.fontSize
        fontSizeValue.textContent = settings.fontSize + "px"
        screenshotCode.style.fontSize = settings.fontSize + "px"
        themePicker.value = settings.theme
        if (settings.wordWrap) {
          screenshotContainer.classList.add("wrap-text")
          wrapToggle.classList.add("active")
        } else {
          screenshotContainer.classList.remove("wrap-text")
          wrapToggle.classList.remove("active")
        }
        diffToggle.classList.toggle("active", settings.diffMode)
      }

      function loadTheme(theme) {
        const url = `https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/${theme}.min.css`
        if (currentThemeLink) currentThemeLink.remove()
        const css = document.createElement("link")
        css.rel = "stylesheet"
        css.href = url
        document.head.appendChild(css)
        currentThemeLink = css
      }

      function applyDiffHighlighting() {
        const settings = getScreenshotSettings()
        if (!settings.diffMode) return
        const html = screenshotCode.innerHTML
        const lines = html.split("\n")
        const processed = lines.map((line) => {
          const stripped = line.replace(/<[^>]*>/g, "")
          if (stripped.startsWith("+")) return `<span class="diff-add">${line}</span>`
          if (stripped.startsWith("-")) return `<span class="diff-del">${line}</span>`
          return line
        })
        screenshotCode.innerHTML = processed.join("\n")
      }

      async function loadHighlightJs() {
        if (hljsLoaded) return
        const settings = getScreenshotSettings()
        loadTheme(settings.theme)
        await loadScript("https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js")
        hljsLoaded = true
      }

      async function openScreenshot() {
        await loadHighlightJs()
        screenshotCode.textContent = codeBox.value
        delete screenshotCode.dataset.highlighted
        hljs.highlightElement(screenshotCode)
        applyScreenshotSettings()
        applyDiffHighlighting()
        screenshotOverlay.classList.add("visible")
        document.body.style.overflow = "hidden"
      }

      function closeScreenshot() {
        screenshotOverlay.classList.remove("visible")
        document.body.style.overflow = ""
      }

      screenshotButton.addEventListener("click", openScreenshot)
      screenshotClose.addEventListener("click", closeScreenshot)
      screenshotOverlay.addEventListener("click", (e) => {
        if (e.target === screenshotOverlay) closeScreenshot()
      })
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && screenshotOverlay.classList.contains("visible")) {
          closeScreenshot()
        }
      })

      fontSizeSlider.addEventListener("input", () => {
        const size = fontSizeSlider.value
        fontSizeValue.textContent = size + "px"
        screenshotCode.style.fontSize = size + "px"
        saveScreenshotSettings({ ...getScreenshotSettings(), fontSize: parseInt(size) })
      })

      wrapToggle.addEventListener("click", () => {
        const isWrapped = screenshotContainer.classList.toggle("wrap-text")
        wrapToggle.classList.toggle("active", isWrapped)
        saveScreenshotSettings({ ...getScreenshotSettings(), wordWrap: isWrapped })
      })

      themePicker.addEventListener("change", () => {
        const theme = themePicker.value
        loadTheme(theme)
        saveScreenshotSettings({ ...getScreenshotSettings(), theme })
      })

      diffToggle.addEventListener("click", () => {
        const settings = getScreenshotSettings()
        const newDiffMode = !settings.diffMode
        saveScreenshotSettings({ ...settings, diffMode: newDiffMode })
        diffToggle.classList.toggle("active", newDiffMode)
        // Re-highlight to apply/remove diff styling
        screenshotCode.textContent = codeBox.value
        delete screenshotCode.dataset.highlighted
        hljs.highlightElement(screenshotCode)
        applyDiffHighlighting()
      })
    </script>
  </body>
</html>
